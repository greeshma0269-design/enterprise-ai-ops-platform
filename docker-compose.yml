services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: aiops
      POSTGRES_USER: app
      POSTGRES_PASSWORD: app
    ports: ["5432:5432"]

  redpanda:
    image: redpandadata/redpanda:v25.1.6
    command:
      - redpanda
      - start
      - --overprovisioned
      - --smp=1
      - --memory=512M
      - --reserve-memory=0M
      - --node-id=0
      - --check=false
      - --kafka-addr=0.0.0.0:9092
      - --advertise-kafka-addr=redpanda:9092
    ports: ["19092:9092"]

  validation-service:
    build: ./services/validation-service
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://postgres:5432/aiops
      SPRING_DATASOURCE_USERNAME: app
      SPRING_DATASOURCE_PASSWORD: app
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports: ["8081:8081"]
    depends_on: [postgres, redpanda]

  reconciliation-service:
    build: ./services/reconciliation-service
    environment:
      SPRING_KAFKA_BOOTSTRAP_SERVERS: redpanda:9092
    ports: ["8082:8082"]
    depends_on: [redpanda]

  ai-service:
    build: ./services/ai-service
    environment:
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      OPENAI_MODEL: ${OPENAI_MODEL:-gpt-5-mini}
    ports: ["8000:8000"]

  frontend:
    build: ./frontend
    ports: ["5173:80"]
    depends_on:
      - validation-service
      - reconciliation-service
      - ai-service
